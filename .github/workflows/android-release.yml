name: MYRAA AI Build & APK Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode debug keystore if needed
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run Unit & Robolectric Tests
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:testDebugUnitTest
          else
            gradle :app:testDebugUnitTest
          fi

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug
          else
            gradle :app:assembleDebug
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myraa-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MYRAA AI v1.0.${{ github.run_number }}
          body: |
            Automated MYRAA AI Debug APK build from commit ${{ github.sha }}.
            - Default Assistant Voice: Mahi
            - Android 14 / 15 compatible
          files: app/build/outputs/apk/debug/app-debug.apk
